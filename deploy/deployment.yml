apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube2kafka
  namespace: kube2kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube2kafka
  template:
    metadata:
      labels:
        app: kube2kafka
    spec:
      serviceAccountName: kube2kafka-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube2kafka
          image: ghcr.io/raczu/kube2kafka:0.2.0
          resources:
            # Adjust the resource limits and requests to expected events traffic.
            requests:
              memory: "64Mi"
              cpu: "100m"
              ephemeral-storage: "50Mi"
            limits:
              memory: "96Mi"
              cpu: "150m"
              ephemeral-storage: "128Mi"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - "-config=/home/nonroot/.kube2kafka/config.yml"
          volumeMounts:
            - name: config
              mountPath: /home/nonroot/.kube2kafka
      volumes:
        - name: config
          secret:
            secretName: kube2kafka-config
            items:
              - key: config.yml
                path: config.yml